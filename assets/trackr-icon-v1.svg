<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Trackr app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#1D3350"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ED3FF"/>
      <stop offset="100%" stop-color="#18A9FF"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>

  <circle cx="512" cy="512" r="270" fill="none" stroke="url(#ring)" stroke-width="54" stroke-linecap="round" filter="url(#softGlow)"/>

  <circle cx="512" cy="512" r="228" fill="none" stroke="#9EE9FF" stroke-opacity="0.22" stroke-width="6"/>

  <rect x="356" y="360" width="312" height="92" rx="24" fill="#F7FBFF"/>
  <rect x="466" y="438" width="92" height="250" rx="24" fill="#F7FBFF"/>

  <circle cx="512" cy="512" r="10" fill="#F7FBFF"/>
</svg>
